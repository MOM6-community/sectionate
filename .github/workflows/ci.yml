name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.7.0
        with:
          access_token: ${{ github.token }}
      - name: Checkout source
        uses: actions/checkout@v2

      - name: Conda setup
        uses: conda-incubator/setup-miniconda@v2
        with:
          channels: conda-forge
          mamba-version: '*'
          python-version: ${{ matrix.python-version }}
          activate-environment: test_env_sectionate
          auto-activate-base: false

      - name: Set up conda environment
        run: |
          mamba env update -f ci/environment.yml
          python -m pip install -e .
          # The topology-driven multi-tile section/transport tests need the
          # unreleased xgcm v1.0.0 line, which folds in the face_connections
          # halo-padding fix (xgcm#712, carried by the bipolar north-fold xgcm#711)
          # and the bare-DataArray other_component vector-pad fix (xgcm#749) for
          # correct vector diff/interp across rotated/reversed seams. Installed
          # LAST with --force-reinstall --no-deps: setuptools_scm reports a dev
          # version below the xgcm>=0.9.0 floor, so a plain `pip install -e .`
          # pulls a PyPI xgcm that would otherwise clobber this branch.
          python -m pip install --force-reinstall --no-deps "xgcm @ git+https://github.com/hdrake/xgcm.git@dev-v1.0.0"
      - name: Conda list information
        run: |
          conda env list
          conda list
      - name: Test with pytest
        run: |
          pytest
