name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.7.0
        with:
          access_token: ${{ github.token }}
      - name: Checkout source
        uses: actions/checkout@v2

      - name: Conda setup
        uses: conda-incubator/setup-miniconda@v2
        with:
          channels: conda-forge
          mamba-version: '*'
          python-version: ${{ matrix.python-version }}
          activate-environment: test_env_sectionate
          auto-activate-base: false

      - name: Set up conda environment
        run: |
          mamba env update -f ci/environment.yml
          # The topology-driven multi-tile section/transport and bipolar north-fold
          # tests need xgcm >= 0.10.1, which introduces the fold boundary
          # (padding={"Y": {"fold": ...}}, formerly xgcm#711), the face_connections
          # halo-padding fix (xgcm#712), and the other_component vector-pad fix
          # (xgcm#749). It is a plain PyPI dependency, pulled in by `pip install -e .`.
          python -m pip install -e .
      - name: Conda list information
        run: |
          conda env list
          conda list
      - name: Test with pytest
        run: |
          pytest
